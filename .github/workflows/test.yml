name: Test formula

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: brew test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      # No actions/checkout here: for a repository named homebrew-*, the
      # setup-homebrew action taps it itself, checked out at GITHUB_SHA (the
      # PR merge commit or the pushed commit), and exposes the tap's path.
      # A separate `brew tap zegit-zoo/tap $GITHUB_WORKSPACE` would fail
      # with "remote mismatch" against that pre-existing tap.
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6  # 2026.09.21.1
        id: brew

      - name: Assert the tapped commit is the one under test
        env:
          TAP_PATH: ${{ steps.brew.outputs.repository-path }}
        run: |
          tapped="$(git -C "$TAP_PATH" rev-parse HEAD)"
          echo "tap at $TAP_PATH is $tapped (GITHUB_SHA=$GITHUB_SHA)"
          [ "$tapped" = "$GITHUB_SHA" ]

      - name: brew style
        run: brew style zegit-zoo/tap

      - name: brew audit
        run: brew audit --strict --online zegit-zoo/tap/meerkat

      - name: brew install
        run: brew install zegit-zoo/tap/meerkat

      - name: brew test
        run: brew test zegit-zoo/tap/meerkat
