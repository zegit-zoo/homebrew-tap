name: Bump formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "meerkat release tag to pin (e.g. v0.11.2), or 'latest'"
        required: false
        default: latest
  schedule:
    # Every 6 hours, at a minute that isn't the top of the hour.
    - cron: "17 */6 * * *"

# Restrictive default: the job below opts into write access explicitly.
permissions:
  contents: read

jobs:
  bump:
    name: Regenerate meerkat.rb
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the bump commit to main
    steps:
      # setup-homebrew goes FIRST. For a repository named homebrew-*, it
      # empties the workspace (.git included), puts a fresh repository at
      # GITHUB_SHA there, and links the tap to it (setup-homebrew/main.sh at
      # the pinned SHA, "Make repo available under GITHUB_WORKSPACE"). Run
      # after the regenerate step, as it used to be, it discarded the new
      # formula, together with the checkout's push credentials and main's
      # upstream. brew then tested the committed formula, and 0.13.0 passed
      # for the v0.15.0 bump (run 36685011538). It now runs on every run,
      # no-ops included, which costs about 20 s.
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6  # 2026.09.21.1
        id: brew

      # Checked out AFTER setup-homebrew, into the same (linked) directory:
      # the tap brew reads is this checkout, which keeps its credentials and
      # main's upstream for the push below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # Hard-fails if the release's checksums file doesn't verify against
      # meerkat's release workflow identity, so an unverified formula can
      # never reach main.
      - name: Regenerate the formula
        env:
          TAG: ${{ inputs.tag || 'latest' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-formula.sh "$TAG"

      # A push made with GITHUB_TOKEN does not trigger test.yml, so a bump
      # would otherwise land on main untested. Gate it here instead: skipped
      # when nothing changed. The target tag is read here, straight after
      # regenerating, so the checks below compare against what was verified,
      # not against whatever the working tree holds later.
      - name: Check whether the formula changed
        id: changed
        run: |
          if git diff --quiet -- Formula/meerkat.rb; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Formula already up to date; nothing to test or commit."
            exit 0
          fi
          # The formula has no explicit `version` (brew audit --strict
          # rejects restating it), so read the tag out of the URLs.
          tag="$(sed -n 's|.*/releases/download/\(v[0-9][^/]*\)/.*|\1|p' \
            Formula/meerkat.rb | head -n 1)"
          if [ -z "$tag" ]; then
            echo "Could not read the tag back out of Formula/meerkat.rb" >&2
            exit 1
          fi
          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Regenerated for $tag."

      # `brew install ./Formula/meerkat.rb` is rejected outright ("Homebrew
      # requires formulae to be in a tap"), so the tap is what gets tested.
      # It is normally this checkout. Should setup-homebrew ever hand over a
      # separate clone, the regenerated formula is copied into it. Either way
      # the installed version must be the target, so a test of the wrong
      # formula can never pass again.
      - name: Install and test the regenerated formula
        if: steps.changed.outputs.changed == 'true'
        env:
          TAP_PATH: ${{ steps.brew.outputs.repository-path }}
          TAG: ${{ steps.changed.outputs.tag }}
        run: |
          if [ Formula/meerkat.rb -ef "$TAP_PATH/Formula/meerkat.rb" ]; then
            echo "The tap is this checkout."
          else
            cp Formula/meerkat.rb "$TAP_PATH/Formula/meerkat.rb"
          fi
          brew style zegit-zoo/tap
          brew audit --strict --online zegit-zoo/tap/meerkat
          brew install zegit-zoo/tap/meerkat
          installed="$(brew info --json=v2 zegit-zoo/tap/meerkat |
            jq -r '.formulae[0].installed[0].version // empty')"
          if [ "$installed" != "${TAG#v}" ]; then
            echo "brew installed meerkat '${installed}', not ${TAG#v}: it did not read the regenerated formula." >&2
            exit 1
          fi
          echo "Installed meerkat ${installed}, the target ${TAG}."
          brew test zegit-zoo/tap/meerkat

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        env:
          TAG: ${{ steps.changed.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/meerkat.rb
          git commit -m "meerkat: bump to ${TAG}"
          git push
